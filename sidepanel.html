<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<title>THM Tutor</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #2b6cb0;
    --bubble-ai: #232734;
    --text: #e8e8ea;
    --muted: #9aa0ab;
    --accent: #4fd1c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #2a2e38;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 15px; margin: 0; }
  #settingsBtn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px;
  }
  #settingsPanel {
    display: none;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #2a2e38;
    gap: 6px;
    flex-direction: column;
  }
  #settingsPanel input, #settingsPanel select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #2a2e38;
    background: #0f1115;
    color: var(--text);
    font-size: 12px;
  }
  #settingsPanel button {
    padding: 6px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #0f1115;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
  }
  #contextBar {
    padding: 8px 14px;
    font-size: 11px;
    color: var(--muted);
    background: #11141b;
    border-bottom: 1px solid #2a2e38;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #contextBar button {
    background: none;
    border: 1px solid #2a2e38;
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 88%;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border-bottom-left-radius: 3px;
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 11px;
  }
  #inputBar {
    display: flex;
    padding: 10px;
    gap: 8px;
    border-top: 1px solid #2a2e38;
    background: var(--panel);
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    border-radius: 8px;
    border: 1px solid #2a2e38;
    background: #0f1115;
    color: var(--text);
    padding: 8px;
    font-size: 13px;
    font-family: inherit;
    height: 40px;
  }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 700;
    border-radius: 8px;
    padding: 0 16px;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>🎓 THM Tutor</h1>
    <button id="settingsBtn">⚙ Settings</button>
  </header>

  <div id="settingsPanel">
    <label style="font-size:11px;color:var(--muted);">OpenRouter API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-or-..." />
    <label style="font-size:11px;color:var(--muted);">Model</label>
    <select id="modelSelect">
      <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
      <option value="openai/gpt-4o-mini">GPT-4o mini</option>
      <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
    </select>
    <button id="saveSettings">Save</button>
  </div>

  <div id="contextBar">
    <span id="contextStatus">Page padhi nahi gayi</span>
    <button id="refreshContext">🔄 Page padho</button>
  </div>

  <div id="chat"></div>

  <div id="inputBar">
    <textarea id="userInput" placeholder="Apna sawaal yahan likhiye..."></textarea>
    <button id="sendBtn">Bhejo</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
